<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'Montreal-Regular';
            src: url('../home/Montreal-Regular.woff') format('woff');
        }

        @font-face {
            font-family: 'Montreal-Bold';
            src: url('../home/Montreal-Bold.woff') format('woff');
        }

        body {
            background-color: #fafafa;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Montreal-Regular', sans-serif;
        }

        .project-item {
            font-family: 'Montreal-Bold', sans-serif;
            font-size: 20px;
            font-weight: 700;
            padding: 24px;
            border: 2px solid #111;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 130px;
            text-decoration: none;
            color: #111;
            border-radius: 12px;
            box-shadow: 0 4px 0px #111;
        }

        .project-item:hover {
            background: #111;
            color: white;
            transform: translateY(-4px);
            box-shadow: 0 8px 0px #111;
            z-index: 10;
        }

        /* Floating Screenshots Overlay */
        .screenshots-overlay {
            position: fixed;
            background: white;
            border: 2.5px solid #111;
            padding: 16px;
            z-index: 1000;
            width: 460px;
            height: 340px;
            display: none;
            box-shadow: 0 16px 48px rgba(0,0,0,0.15);
            pointer-events: none;
            border-radius: 16px;
            transition: transform 0.1s ease-out;
        }

        .screenshots-overlay.visible {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .screenshot-container {
            display: none;
            width: 100%;
            height: calc(100% - 32px);
        }

        .screenshot-container.active {
            display: flex;
            flex-direction: column;
        }

        .screenshot-title {
            font-family: 'Montreal-Regular', sans-serif;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 8px;
            color: #111;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .screenshot-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            border: 2px solid #111;
            object-fit: cover;
            border-radius: 8px;
        }

        /* Slideshow Navigation Bullets */
        .slideshow-indicators {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
            width: 100%;
        }

        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ddd;
            border: 1px solid #111;
            transition: all 0.3s ease;
        }

        .indicator.active {
            background: #111;
            transform: scale(1.2);
        }

        .overlay-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.03);
            z-index: 999;
            display: none;
            pointer-events: none;
        }

        .overlay-backdrop.visible {
            display: block;
        }
        
        /* Interactive Header Navigation */
        .scroll-container {
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            overflow: hidden;
            position: fixed;
            display: flex;
            align-items: center;
            padding: 0 40px;
            background: white;
            border-bottom: 2px solid #111;
            z-index: 500;
        }

        .word-box {
            height: 40px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            margin-right: 24px;
        }

        .text-wrapper {
            position: relative;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .text1, .text2 {
            font-size: 24px;
            font-weight: 700;
            white-space: nowrap;
            text-decoration: none;
            display: block;
            line-height: 40px;
        }

        .text1 { color: #888; }
        .text1 .w { color: #111; }

        .text2 {
            color: #111;
            opacity: 0;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            transition: opacity 0.2s ease-in-out;
        }

        .word-box:hover .text-wrapper { transform: translateY(-100%); }
        .word-box:hover .text1 { opacity: 0; }
        .word-box:hover .text2 { opacity: 1; }

        /* Slow Morph Transition Layer (1.2s) */
        #transitionOverlay {
            position: fixed;
            z-index: 9999;
            background-size: cover;
            background-position: center;
            border: 2px solid #111;
            border-radius: 8px;
            transition: all 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            pointer-events: none;
            opacity: 0;
            left: 0;
            top: 0;
            width: 0;
            height: 0;
        }
    </style>
</head>
<body>
    <div class="scroll-container">
        <div class="word-box">
            <div class="text-wrapper">
                <a class="text1" href="../home/biotransition.html">Bio,</a>
                <a class="text2" href="../home/biotransition.html">Bio,</a>
            </div>
        </div>
        <div class="word-box">
            <div class="text-wrapper">
                <a class="text1" href="#"><span class="w">Works,</span></a>
                <a class="text2" href="#">Works,</a>
            </div>
        </div>
        <div class="word-box">
            <div class="text-wrapper">
                <a class="text1" href="mailto:nishanthnaidu268@gmail.com">Contacts</a>
                <a class="text2" href="mailto:nishanthnaidu268@gmail.com">Contacts</a>
            </div>
        </div>
    </div>

    <!-- Active Backdrop for visual focus depth -->
    <div class="overlay-backdrop" id="overlayBackdrop"></div>
    
    <!-- Floating Tracking Overlay -->
    <div class="screenshots-overlay" id="screenshotsOverlay"></div>
    
    <!-- Dynamic Morphing Canvas Layer -->
    <div id="transitionOverlay"></div>

    <!-- Main Portfolio Gallery Grid -->
    <div class="w-full max-w-6xl px-6 mt-16" id="galleryContainer">
        <h1 class="text-xs uppercase tracking-widest text-gray-400 font-bold mb-4 text-center md:text-left">Interactive Showcase</h1>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="projectsContainer"></div>
    </div>

    <script>
        const projects = [
            {
                name: "CineScope",
                url: "CineScope/CineScope.html",
                screenshots: [
{ title: "First Page", url: "CineScope/firstpage.png" },
                    { title: "Login View", url: "CineScope/Screenshot 2023-07-21 141053.png" },
                    { title: "Registration View", url: "CineScope/Screenshot 2023-07-21 141604.png" },
                    { title: "User Login Interface", url: "CineScope/Screenshot 2023-07-21 155235.png" },
                    { title: "Main Dashboard", url: "CineScope/Screenshot 2023-07-21 140636.png" },
                    { title: "Media Stream Interface", url: "CineScope/Screenshot 2023-07-21 143943.png" },
                    { title: "Anime Streaming View", url: "CineScope/Screenshot 2023-07-21 153200.png" },
                    { title: "Video Player with Description", url: "CineScope/Screenshot 2023-07-21 153925.png" },
                    { title: "Exit Confirmation Modal", url: "CineScope/Screenshot 2023-07-21 155131.png" },
                    { title: "Admin Management Portal", url: "CineScope/Screenshot 2023-07-21 160945.png" },
                    { title: "Upload Video - Anime", url: "CineScope/anime.png" },
                    { title: "Upload Video - Drama", url: "CineScope/drama.png" },
                    { title: "Upload Video - Movie", url: "CineScope/movie.png" },
                    { title: "Upload Video - Web Series", url: "CineScope/web.png" },
                    { title: "Admin Delete Portal", url: "CineScope/Screenshot 2023-07-21 161050.png" },
                    { title: "Delete Web Episode", url: "CineScope/Screenshot 2023-07-21 160249.png" },
                    { title: "Delete Movie", url: "CineScope/Screenshot 2023-07-21 160355.png" },
                    { title: "Delete Anime Episode", url: "CineScope/Screenshot 2023-07-21 160419.png" },
                    { title: "Delete Drama Episode", url: "CineScope/Screenshot 2023-07-21 160448.png" },
                    { title: "Delete Web Episode View", url: "CineScope/Screenshot 2023-07-21 160547.png" },
                    { title: "Delete User", url: "CineScope/user.png" },
                    { title: "Database Records - Web Series", url: "CineScope/webseries.png" },
                    { title: "Database Schema Overview", url: "CineScope/Screenshot 2023-07-21 161143.png" },
                    { title: "Database Records - Drama", url: "CineScope/dramadb.png" },
                    { title: "Database Records - Movies", url: "CineScope/movies.png" }
                ]
            },
            {
                name: "AHAR Framework",
                url: "AHAR/AHAR.html",
                screenshots: [
                    { title: "Code Overview", url: "AHAR/Code.png" },
                    { title: "Network Admin Policy", url: "AHAR/Network Admin policy.png"},
                    { title: "Auditor Policy", url: "AHAR/Auditor policy.png" },
                    { title: "Data Scientist Policy", url: "AHAR/Datascientist policy.png"}
                ]
            },
            {
                name: "Hate Speech Detector",
                url: "HateSpeech/index.html",
                screenshots: [
                    { title: "Admin Analytics Dashboard", url: "https://placehold.co/640x360/110c11/ffffff?text=Activity+Dashboard" },
                    { title: "Draggable Kanban Details", url: "https://placehold.co/640x360/201224/ffffff?text=Task+Details" }
                ]
            },
            {
                name: "Encrypted Key Logger",
                url: "KeyLogger/index.html",
                screenshots: [
                    { title: "Keylogger in Action", url: "Keylogger/Keylogger in action.png" },
                    { title: "Receiver side POV", url: "Keylogger/Receiver side POV.png" },
                    { title: "Decrypted Output", url: "Keylogger/Decrypted Output.png" }
                ]
            },
            {
                name: "Linux System Audit Tool",
                url: "LinuxAudit/index.html",
                screenshots: [
                    { title: "Audit Code", url: "Hardening/Code.png" },
                    { title: "Hardening Score", url: "Hardening/Hardning score.png" }
                ]
            }
        ];

        const projectsContainer = document.getElementById("projectsContainer");
        const screenshotsOverlay = document.getElementById("screenshotsOverlay");
        const overlayBackdrop = document.getElementById("overlayBackdrop");
        const transitionOverlay = document.getElementById("transitionOverlay");
        
        let mouseX = 0;
        let mouseY = 0;
        let slideshowInterval = null;
        let currentScreenshotIndex = 0;
        let currentProjectScreenshots = [];

        document.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            if (screenshotsOverlay.classList.contains("visible")) {
                positionOverlay();
            }
        });

        function renderProjects() {
            if (!projectsContainer) return;
            projectsContainer.innerHTML = "";
            projects.forEach((project, index) => {
                const projectItem = document.createElement("div");
                projectItem.className = "project-item";
                projectItem.textContent = project.name;
                projectItem.dataset.index = index;

                projectItem.addEventListener("mouseenter", () => showScreenshots(index));
                projectItem.addEventListener("mouseleave", () => hideScreenshots());
                projectItem.addEventListener("click", () => triggerMorphTransition(index));

                projectsContainer.appendChild(projectItem);
            });
        }

        function showScreenshots(index) {
            const project = projects[index];
            screenshotsOverlay.innerHTML = "";
            currentProjectScreenshots = project.screenshots;
            currentScreenshotIndex = 0;

            project.screenshots.forEach((screenshot, i) => {
                const container = document.createElement("div");
                container.className = "screenshot-container";
                container.dataset.index = i;

                const title = document.createElement("div");
                title.className = "screenshot-title";
                title.textContent = screenshot.title;

                const image = document.createElement("img");
                image.className = "screenshot-image";
                image.src = screenshot.url;
                image.alt = screenshot.title;

                container.appendChild(title);
                container.appendChild(image);
                screenshotsOverlay.appendChild(container);
            });

            const indicators = document.createElement("div");
            indicators.className = "slideshow-indicators";
            
            project.screenshots.forEach((_, i) => {
                const indicator = document.createElement("div");
                indicator.className = "indicator";
                if (i === 0) indicator.classList.add("active");
                indicators.appendChild(indicator);
            });
            
            screenshotsOverlay.appendChild(indicators);

            screenshotsOverlay.classList.add("visible");
            overlayBackdrop.classList.add("visible");
            
            showSlide(0);
            positionOverlay();
            startSlideshow();
        }

        function showSlide(index) {
            const containers = screenshotsOverlay.querySelectorAll(".screenshot-container");
            const indicators = screenshotsOverlay.querySelectorAll(".indicator");
            
            containers.forEach((container, i) => {
                container.classList.toggle("active", i === index);
            });
            
            indicators.forEach((indicator, i) => {
                indicator.classList.toggle("active", i === index);
            });
            
            currentScreenshotIndex = index;
        }

        function nextSlide() {
            if (currentProjectScreenshots.length === 0) return;
            const nextIndex = (currentScreenshotIndex + 1) % currentProjectScreenshots.length;
            showSlide(nextIndex);
        }

        function startSlideshow() {
            clearInterval(slideshowInterval);
            slideshowInterval = setInterval(nextSlide, 2000);
        }

        function positionOverlay() {
            const overlayWidth = 460;  
            const overlayHeight = 340; 
            
            let left = mouseX + 24;
            let top = mouseY + 24;
            
            if (left + overlayWidth > window.innerWidth) {
                left = mouseX - overlayWidth - 24;
            }
            if (top + overlayHeight > window.innerHeight) {
                top = window.innerHeight - overlayHeight - 24;
            }
            if (top < 0) top = 24;
            
            screenshotsOverlay.style.left = left + "px";
            screenshotsOverlay.style.top = top + "px";
        }

        function hideScreenshots() {
            clearInterval(slideshowInterval);
            slideshowInterval = null;
            currentProjectScreenshots = [];
            screenshotsOverlay.classList.remove("visible");
            overlayBackdrop.classList.remove("visible");
        }

        /* Slowed-down morph transition (1.2s) */
        function triggerMorphTransition(projectIndex) {
            const project = projects[projectIndex];
            const activeImage = screenshotsOverlay.querySelector(".screenshot-container.active img");
            
            let startRect;
            let imageSrc = "";

            if (activeImage && activeImage.complete && activeImage.naturalWidth !== 0) {
                startRect = activeImage.getBoundingClientRect();
                imageSrc = activeImage.src;
            } else {
                const overlayRect = screenshotsOverlay.getBoundingClientRect();
                if (overlayRect.width > 0) {
                    startRect = overlayRect;
                } else {
                    startRect = { 
                        left: window.innerWidth / 2 - 200, 
                        top: window.innerHeight / 2 - 150, 
                        width: 400, 
                        height: 300 
                    };
                }
                imageSrc = project.screenshots[currentScreenshotIndex] ? 
                           project.screenshots[currentScreenshotIndex].url : 
                           project.screenshots[0].url;
            }

            transitionOverlay.style.backgroundImage = `url('${imageSrc}')`;
            transitionOverlay.style.backgroundSize = "cover";
            transitionOverlay.style.backgroundPosition = "center";
            transitionOverlay.style.left = `${startRect.left}px`;
            transitionOverlay.style.top = `${startRect.top}px`;
            transitionOverlay.style.width = `${startRect.width}px`;
            transitionOverlay.style.height = `${startRect.height}px`;
            transitionOverlay.style.borderRadius = "8px";
            transitionOverlay.style.opacity = "1";

            hideScreenshots();

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    transitionOverlay.style.left = "0px";
                    transitionOverlay.style.top = "0px";
                    transitionOverlay.style.width = "100vw";
                    transitionOverlay.style.height = "100vh";
                    transitionOverlay.style.borderRadius = "0px";
                });
            });

            setTimeout(() => {
                if (project.url && project.url !== "#") {
                    window.location.href = project.url;
                } else {
                    transitionOverlay.style.opacity = "0";
                    setTimeout(() => {
                        transitionOverlay.style.width = "0";
                        transitionOverlay.style.height = "0";
                    }, 1200);
                }
            }, 1200);
        }

        // Initialize grid on DOM load
        document.addEventListener("DOMContentLoaded", renderProjects);
        renderProjects();
    </script>
</body>
</html>
